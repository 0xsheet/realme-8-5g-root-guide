[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realme-root-guide"
version = "1.0.0"
description = "Auditable RMX3241 F.12 rooting case study and explicit device-bound tooling"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
rootguide = "rootguide.cli:main"

[tool.setuptools]
packages = ["rootguide"]
